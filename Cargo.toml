[package]
name = "ai-usage"
version = "0.1.2"
edition = "2024"
description = "Local Claude Code and Codex usage to model-by-model CSV"
license = "MIT"

[[bin]]
name = "aiUsage"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
csv = "1"
dirs = "6"
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
tempfile = "3"

[profile.release]
strip = true
